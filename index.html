<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مافیای آنلاین</title><style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#f4eee3;font:16px Tahoma}main{max-width:720px;margin:auto;padding:16px}.card{background:#202a3d;border:1px solid #39465e;border-radius:16px;padding:16px;margin:12px 0}h1{text-align:center;color:#e6bd70}.muted{color:#aab6c8;font-size:13px}input,button{width:100%;padding:13px;border:0;border-radius:10px;margin:5px 0;font:inherit}input{background:#111a2a;color:white}button{background:#a62e48;color:white;font-weight:bold}.alt{background:#485773}.gold{background:#d4aa5b;color:#171717}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:9px;border-bottom:1px solid #3b465a}.role{text-align:center;color:#f1c76d;font-size:23px;padding:12px}.log{font-size:13px;line-height:1.8;max-height:160px;overflow:auto}.notice{color:#f2c66a;text-align:center}.pill{display:inline-block;background:#111a2a;border-radius:20px;padding:5px 10px;margin:3px}
</style></head><body><main><h1>🎭 مافیای آنلاین</h1><p class="muted" style="text-align:center">بازی مستقل تحت وب · بدون تلگرام · بدون ربات</p><section id="home" class="card"><input id="name" maxlength="24" placeholder="نام بازیکن"><div class="grid"><button id="create">ساخت اتاق</button><button id="showJoin" class="alt">ورود با کد</button></div><div id="joinBox" class="hidden"><input id="room" placeholder="کد اتاق"><button id="join">ورود به اتاق</button></div></section><section id="game" class="hidden"><div class="card"><div>کد اتاق: <b id="code"></b> <span class="pill" id="phase"></span></div><div id="role" class="role">نقش شما هنوز مشخص نشده</div><div id="timer" class="muted"></div><div id="players"></div><button id="start" class="gold hidden">شروع بازی</button></div><section id="actions" class="card hidden"></section><div class="card"><b>🎙 ویس چت اتاق</b><p class="muted">برای صحبت، میکروفون را روشن کن. صدای زنده از طریق WebRTC بین اعضای متصل ردوبدل می‌شود؛ دسترسی میکروفون و HTTPS لازم است.</p><div class="grid"><button id="mic">🎙 روشن کردن میکروفون</button><button id="mute" class="alt">قطع میکروفون</button></div><div id="voiceStatus" class="muted">میکروفون خاموش است.</div></div><div class="card"><b>💬 گفت‌وگوی روز</b><div id="chat"></div><input id="msg" placeholder="پیام"><button id="send">ارسال پیام</button></div><div class="card"><b>گزارش بازی</b><div id="log" class="log"></div></div></section><p id="notice" class="notice"></p></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let me,st,role,localStream,peers={};const esc=x=>String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));$('showJoin').onclick=()=>$('joinBox').classList.toggle('hidden');$('create').onclick=()=>s.emit('createRoom',{name:$('name').value});$('join').onclick=()=>s.emit('joinRoom',{name:$('name').value,room:$('room').value});s.on('joined',d=>{me=s.id;$('code').textContent=d.code;$('home').classList.add('hidden');$('game').classList.remove('hidden')});s.on('errorMsg',m=>$('notice').textContent=m);s.on('private',m=>$('notice').textContent=m);s.on('role',d=>{role=d.role;$('role').textContent='نقش شما: '+d.role+' · '+d.team});s.on('state',d=>{st=d;$('phase').textContent=({lobby:'لابی',night:'شب',day:'روز',vote:'رأی‌گیری',ended:'پایان'})[d.phase]||d.phase;$('players').innerHTML=d.players.map(p=>`<div class="player">${esc(p.name)} ${p.alive?'':'💀'} ${p.host?'(میزبان)':''}</div>`).join('');$('log').innerHTML=d.log.map(x=>'<div>'+esc(x)+'</div>').join('');$('start').classList.toggle('hidden',!(d.phase==='lobby'&&d.players.some(p=>p.id===me&&p.host)));renderActions()});function renderActions(){let a=$('actions');if(!st||!['night','vote'].includes(st.phase)){a.classList.add('hidden');return}let allowed=st.phase==='vote'||['مافیا','پدرخوانده','دکتر','کارآگاه','تک‌تیرانداز'].includes(role);a.classList.toggle('hidden',!allowed);a.innerHTML='<b>'+(st.phase==='vote'?'رأی برای حذف':'کنش شب')+'</b><div class="grid">'+st.players.filter(p=>p.alive&&p.id!==me).map(p=>`<button class="alt" data-id="${p.id}">${esc(p.name)}</button>`).join('')+'</div>';a.querySelectorAll('button').forEach(b=>b.onclick=()=>s.emit(st.phase==='vote'?'vote':'action',{target:b.dataset.id}))}$('start').onclick=()=>s.emit('startGame');$('send').onclick=()=>{s.emit('chat',{text:$('msg').value});$('msg').value=''};s.on('chat',m=>$('chat').innerHTML+=`<p><b>${esc(m.name)}:</b> ${esc(m.text)}</p>`);s.on('gameOver',d=>$('notice').textContent='برنده: '+d.winner);setInterval(()=>{if(st?.deadline)$('timer').textContent='زمان باقی‌مانده: '+Math.max(0,Math.ceil((st.deadline-Date.now())/1000))+' ثانیه'},1000);
// WebRTC mesh voice with server-assisted signaling. STUN is configured; restrictive networks may require TURN credentials.
const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};async function peer(id,offer){if(peers[id])return peers[id];const pc=new RTCPeerConnection(ice);peers[id]=pc;if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)s.emit('voice-ice',{to:id,data:e.candidate})};pc.ontrack=e=>{let el=document.getElementById('audio-'+id);if(!el){el=document.createElement('audio');el.id='audio-'+id;el.autoplay=true;document.body.appendChild(el)}el.srcObject=e.streams[0]};if(offer){const o=await pc.createOffer();await pc.setLocalDescription(o);s.emit('voice-offer',{to:id,data:o})}return pc}s.on('connect',()=>{me=s.id});s.on('voice-offer',async m=>{const pc=await peer(m.from,false);await pc.setRemoteDescription(m.data);const a=await pc.createAnswer();await pc.setLocalDescription(a);s.emit('voice-answer',{to:m.from,data:a})});s.on('voice-answer',async m=>{if(peers[m.from])await peers[m.from].setRemoteDescription(m.data)});s.on('voice-ice',async m=>{if(peers[m.from])try{await peers[m.from].addIceCandidate(m.data)}catch(e){}});$('mic').onclick=async()=>{try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});for(const p of st?.players||[])if(p.id!==me)await peer(p.id,true);$('voiceStatus').textContent='میکروفون روشن است.'}catch(e){$('voiceStatus').textContent='دسترسی میکروفون ممکن نشد: '+e.message}};$('mute').onclick=()=>{if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=false);$('voiceStatus').textContent='میکروفون قطع شد.'};
</script></body></html>
