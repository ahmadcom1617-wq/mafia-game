<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مافیا</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
body{margin:0;background:#111522;color:#f6f0e5;font:16px Tahoma}main{max-width:650px;margin:auto;padding:20px}.box{background:#20283a;border:1px solid #3b465d;border-radius:16px;padding:16px;margin:12px 0}h1{text-align:center;color:#e8bd67}input,button{width:100%;box-sizing:border-box;padding:13px;margin:5px 0;border:0;border-radius:10px;font:inherit}input{background:#111827;color:white}button{background:#a52c43;color:white;font-weight:bold}.alt{background:#47536b}.gold{background:#d0a34c;color:#171717}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:8px;border-bottom:1px solid #39445a}.muted{color:#aeb8c9;font-size:13px}.role{text-align:center;color:#f0c56b;font-size:24px;padding:15px}.log{font-size:13px;line-height:1.8;max-height:180px;overflow:auto}.notice{color:#f0c56b;text-align:center}</style><main><h1>🎭 مافیا</h1><p class="muted" style="text-align:center">بازی گروهی آنلاین · ۶ تا ۲۰ نفر</p><section id="home" class="box"><input id="name" placeholder="نام بازیکن"><div class="row"><button id="create">ساخت اتاق</button><button class="alt" id="showJoin">ورود</button></div><div id="joinBox" class="hidden"><input id="room" placeholder="کد اتاق"><button id="join">ورود به اتاق</button></div></section><section id="game" class="hidden"><div class="box"><div>کد اتاق: <b id="code"></b> · <span id="phase"></span></div><div id="role" class="role"></div><div id="timer" class="muted"></div><div id="players"></div><button id="start" class="gold hidden">شروع بازی</button></div><div id="targets" class="box hidden"></div><div class="box"><b>چت روز</b><div id="chat"></div><input id="msg" placeholder="پیام"><button id="send">ارسال</button></div><div class="box"><b>گزارش</b><div id="log" class="log"></div></div></section><p id="notice" class="notice"></p></main><script src="/socket.io/socket.io.js"></script><script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();} const s=io({auth:{initData:tg?.initData||""}}),$=x=>document.getElementById(x);let me,st,role;const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));$("showJoin").onclick=()=> $("joinBox").classList.toggle("hidden");$("create").onclick=()=>s.emit("createRoom",{name:$("name").value});$("join").onclick=()=>s.emit("joinRoom",{name:$("name").value,room:$("room").value});s.on("joined",d=>{me=s.id;$("code").textContent=d.code;$("home").classList.add("hidden");$("game").classList.remove("hidden")});s.on("connect_error",e=>$("notice").textContent=e.message||"اتصال برقرار نشد.");s.on("errorMsg",t=>$("notice").textContent=t);s.on("private",t=>$("notice").textContent=t);s.on("role",d=>{role=d.role;$("role").textContent="نقش شما: "+d.role+" · "+d.team});s.on("state",d=>{st=d;$("phase").textContent=({lobby:"لابی",night:"شب",day:"روز",vote:"رأی‌گیری",ended:"پایان"})[d.phase];$("players").innerHTML=d.players.map(p=>`<div class="player">${esc(p.name)} ${p.alive?"":"💀"} ${p.host?"(میزبان)":""}</div>`).join("");$("log").innerHTML=d.log.map(x=>"<div>"+esc(x)+"</div>").join("");$("start").classList.toggle("hidden",!(d.phase==="lobby"&&d.players.some(p=>p.id===me&&p.host)));$("timer").textContent=d.deadline?"زمان: "+Math.max(0,Math.ceil((d.deadline-Date.now())/1000))+" ثانیه":"";render()});function render(){let box=$("targets");if(!st||!role||!["night","vote"].includes(st.phase)){box.classList.add("hidden");return}let allowed=st.phase==="vote"||["مافیا","پدرخوانده","دکتر","کارآگاه"].includes(role);box.classList.toggle("hidden",!allowed);box.innerHTML="<b>"+(st.phase==="vote"?"رأی به حذف":"انتخاب هدف شب")+"</b><div class=row>"+st.players.filter(p=>p.alive&&p.id!==me).map(p=>`<button class=alt data-id="${p.id}">${esc(p.name)}</button>`).join("")+"</div>";box.querySelectorAll("button").forEach(b=>b.onclick=()=>s.emit(st.phase==="vote"?"vote":"action",{target:b.dataset.id}))}$("start").onclick=()=>s.emit("startGame");$("send").onclick=()=>{s.emit("chat",{text:$("msg").value});$("msg").value=""};s.on("chat",m=>$("chat").innerHTML+=`<p><b>${esc(m.name)}:</b> ${esc(m.text)}</p>`);s.on("gameOver",d=>$("notice").textContent="برنده: "+d.winner);setInterval(()=>{if(st?.deadline)$("timer").textContent="زمان: "+Math.max(0,Math.ceil((st.deadline-Date.now())/1000))+" ثانیه"},1000);
</script></html>
